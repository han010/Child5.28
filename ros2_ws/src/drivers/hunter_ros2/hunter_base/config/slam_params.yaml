slam_toolbox:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan
    provide_odom_frame: true
    use_map_topic: false
    transform_timeout: 1.0
    tf_buffer_duration: 10.0
    minimum_laser_range: 0.15
    maximum_laser_range: 12.0
    # publish /map faster (seconds per publish), default ~10s in nav2 configs
    map_publish_period_sec: 0.5
    qos_overrides:
      /scan:
        reliability: reliable
