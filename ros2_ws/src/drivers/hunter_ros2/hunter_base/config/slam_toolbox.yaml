slam_toolbox:
  ros__parameters:

    use_sim_time: false
    mode: mapping

    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: scan

    # === 雷达 ===
    min_laser_range: 0.2
    max_laser_range: 12.0

    # === 稳定性 ===
    resolution: 0.05
    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    # === 车载必须开 ===
    use_odometry: true
    use_imu: false

    # === Scan Matching ===
    throttle_scans: 1
    map_update_interval: 1.0

    # === Loop Closing ===
    do_loop_closing: true
    loop_search_maximum_distance: 5.0
