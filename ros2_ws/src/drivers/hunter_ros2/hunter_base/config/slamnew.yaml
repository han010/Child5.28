slam_toolbox:
  ros__parameters:
    use_sim_time: false

    mode: mapping

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    minimum_laser_range: 0.2
    maximum_laser_range: 12.0

    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    use_odometry: true
    use_scan_matching: true

    throttle_scans: 1
    map_update_interval: 1.0

    max_laser_range: 12.0
