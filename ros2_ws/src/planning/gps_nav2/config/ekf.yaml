### robot_localization EKF配置文件
### 用于融合GPS、IMU和轮速计数据，提供map坐标系下的定位

ekf_filter_node:
  ros__parameters:
    # 频率配置
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0

    # 调试配置
    print_diagnostics: true
    debug: false
    debug_out_file: /tmp/ekf_debug.txt

    # TF发布配置
    publish_tf: true
    publish_acceleration: false
    publish_filtered_gps: false

    # 坐标系配置
    map_frame: map           # 全局坐标系 (GPS)
    odom_frame: odom         # 里程计坐标系
    base_link_frame: base_footprint  # 机器人底盘坐标系
    world_frame: map         # EKF输出的参考坐标系

    # ===== 里程计输入 (轮速计+IMU) =====
    # 来源: /odom (revo_odom_node发布)
    # 特点: 高频率(10Hz)，相对定位
    odom0: /odom
    odom0_config: [
      false, false, false,  # x, y, z (不使用odom的位置，漂移大)
      false, false, true,   # roll, pitch, yaw (使用IMU的航向角)
      true,  false, false,  # vx, vy, vz (使用轮速计的线速度)
      false, false, true,   # vroll, vpitch, vyaw (使用IMU的角速度)
      false, false, false   # ax, ay, az (不使用加速度)
    ]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false
    odom0_rejection_threshold: 2.0  # 拒绝阈值(米)

    # ===== GPS输入 (全局定位) =====
    # 来源: /gps/fix (GPS数据)
    # 特点: 低频率(1Hz)，绝对定位，提供全局位置约束
    pose0: /gps/fix
    pose0_config: [
      true,  true,  false,  # x, y, z (使用GPS的位置，z设为false因为是2D)
      false, false, false,  # roll, pitch, yaw (GPS不提供姿态)
      false, false, false,  # vx, vy, vz (GPS速度不准确)
      false, false, false,  # vroll, vpitch, vyaw
      false, false, false   # ax, ay, az
    ]
    pose0_queue_size: 10
    pose0_nodelay: true
    pose0_differential: false
    pose0_relative: false
    pose0_rejection_threshold: 5.0  # GPS误差较大，设置较大阈值

    # ===== IMU输入 (可选) =====
    # 如果有独立的IMU数据源，可以启用
    # imu0: /imu/data
    # imu0_config: [
    #   false, false, false,  # x, y, z
    #   true,  true,  true,   # roll, pitch, yaw (使用IMU姿态)
    #   false, false, false,  # vx, vy, vz
    #   true,  true,  true,   # vroll, vpitch, vyaw
    #   true,  true,  true    # ax, ay, az (使用IMU加速度)
    # ]
    # imu0_queue_size: 10
    # imu0_nodelay: true

    # ===== 过程噪声协方差 =====
    # 这些参数需要根据实际传感器特性调优
